version: "3"

tasks:
  clean:
    desc: "Remove generated Yoga Book release and dependency package directories."
    cmds:
      - |
        find DATA/DEB/upstream DATA/DEB/packages -mindepth 1 -maxdepth 1 -type f -delete 2>/dev/null || true
        rm -f DATA/DEB/packages.manifest

  download:
    desc: "Download and verify all six pinned Yoga Book package assets."
    cmds:
      - |
        MANIFEST=manifests/yogabook-release-debs.tsv
        UPSTREAM_DIR=DATA/DEB/upstream
        [ "$(wc -l < "$MANIFEST")" -eq 6 ] || {
          echo "Error: $MANIFEST must pin exactly six release assets." >&2
          exit 1
        }
        mkdir -p "$UPSTREAM_DIR"
        find "$UPSTREAM_DIR" -mindepth 1 -maxdepth 1 -type f -delete
        while IFS="$(printf '\t')" read -r EXPECTED_SHA256 NAME SOURCE_URL; do
          [ -n "$EXPECTED_SHA256" ] && [ -n "$NAME" ] && [ -n "$SOURCE_URL" ] || {
            echo "Error: malformed line in $MANIFEST" >&2
            exit 1
          }
          DESTINATION="$UPSTREAM_DIR/$NAME"
          LEGACY_SOURCE="DATA/DEB/$NAME"
          if [ -f "$LEGACY_SOURCE" ] \
            && printf '%s  %s\n' "$EXPECTED_SHA256" "$LEGACY_SOURCE" | sha256sum --check --status; then
            cp "$LEGACY_SOURCE" "$DESTINATION"
          else
            curl --fail --show-error --location --output "$DESTINATION.part" "$SOURCE_URL"
            mv "$DESTINATION.part" "$DESTINATION"
          fi
          printf '%s  %s\n' "$EXPECTED_SHA256" "$DESTINATION" | sha256sum --check
        done < "$MANIFEST"
        [ "$(find "$UPSTREAM_DIR" -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 6 ] || {
          echo "Error: expected exactly six downloaded release assets." >&2
          exit 1
        }
        echo "Downloaded and verified all six pinned Yoga Book package assets"

  resolve:
    desc: "Build and network-disable-verify a clean Ubuntu 26.04 offline dependency closure."
    cmds:
      - |
        command -v docker >/dev/null 2>&1 || {
          echo "Error: Docker is required by deb:resolve." >&2
          exit 1
        }
        UPSTREAM_DIR="$PWD/DATA/DEB/upstream"
        PACKAGE_DIR="$PWD/DATA/DEB/packages"
        SELECTED_MANIFEST="$PWD/manifests/yogabook-selected-packages.tsv"
        [ "$(find "$UPSTREAM_DIR" -maxdepth 1 -type f -name '*.deb' 2>/dev/null | wc -l)" -eq 6 ] || {
          echo "Error: all six upstream assets are required; run task deb:download." >&2
          exit 1
        }
        mkdir -p "$PACKAGE_DIR"
        find "$PACKAGE_DIR" -mindepth 1 -maxdepth 1 -type f -delete

        while IFS="$(printf '\t')" read -r EXPECTED_PACKAGE EXPECTED_VERSION EXPECTED_ARCH; do
          MATCHES=0
          for DEB_FILE in "$UPSTREAM_DIR"/*.deb; do
            PACKAGE="$(dpkg-deb -f "$DEB_FILE" Package)"
            VERSION="$(dpkg-deb -f "$DEB_FILE" Version)"
            ARCH="$(dpkg-deb -f "$DEB_FILE" Architecture)"
            if [ "$PACKAGE" = "$EXPECTED_PACKAGE" ] \
              && [ "$VERSION" = "$EXPECTED_VERSION" ] \
              && [ "$ARCH" = "$EXPECTED_ARCH" ]; then
              cp "$DEB_FILE" "$PACKAGE_DIR/"
              MATCHES=$((MATCHES + 1))
            fi
          done
          [ "$MATCHES" -eq 1 ] || {
            echo "Error: expected one $EXPECTED_PACKAGE $EXPECTED_VERSION $EXPECTED_ARCH asset, found $MATCHES." >&2
            exit 1
          }
        done < "$SELECTED_MANIFEST"
        [ "$(find "$PACKAGE_DIR" -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 5 ] || {
          echo "Error: selected release set must contain exactly five distinct packages." >&2
          exit 1
        }

        docker run --rm --platform linux/amd64 \
          -v "$PACKAGE_DIR:/input:ro" \
          -v "$PACKAGE_DIR:/packages" \
          ubuntu:26.04 \
          sh -ceu '
            mkdir -p /selected
            cp /input/*.deb /selected/
            apt-get update
            apt-get install --yes --download-only /selected/*.deb
            find /var/cache/apt/archives -maxdepth 1 -type f -name "*.deb" -exec cp -v {} /packages/ \;
          '

        scripts/package-manifest.sh "$PACKAGE_DIR" > DATA/DEB/packages.manifest.part
        mv DATA/DEB/packages.manifest.part DATA/DEB/packages.manifest
        (
          cd DATA/DEB/packages
          dpkg-scanpackages . /dev/null > Packages.part
          mv Packages.part Packages
        )
        while IFS="$(printf '\t')" read -r EXPECTED_PACKAGE EXPECTED_VERSION EXPECTED_ARCH; do
          awk -F "$(printf '\t')" \
            -v package="$EXPECTED_PACKAGE" -v version="$EXPECTED_VERSION" -v arch="$EXPECTED_ARCH" \
            '$1 == package && $2 == version && $3 == arch { found++ } END { exit found == 1 ? 0 : 1 }' \
            DATA/DEB/packages.manifest || {
              echo "Error: selected package identity missing from dependency manifest: $EXPECTED_PACKAGE $EXPECTED_VERSION $EXPECTED_ARCH" >&2
              exit 1
            }
        done < "$SELECTED_MANIFEST"

        docker run --rm --platform linux/amd64 --network none \
          -v "$PACKAGE_DIR:/opt/yoga-book-debs:ro" \
          ubuntu:26.04 \
          sh -ceu '
            printf "%s\n" "deb [trusted=yes] file:/opt/yoga-book-debs ./" > /etc/apt/sources.list
            rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes \
              alsa-ucm-conf-yogabook \
              linux-headers-7.2.0-rc7-yogabook1 \
              linux-image-7.2.0-rc7-yogabook1 \
              touch-keyboard \
              yogabook-support
            test -z "$(dpkg --audit)"
            apt-get --no-download check
          '
        echo "Built and offline-verified $(wc -l < DATA/DEB/packages.manifest) packages in a network-disabled Ubuntu 26.04 container"

  verify:
    desc: "Verify release assets, selected identities, and the complete generated package manifest."
    cmds:
      - |
        while IFS="$(printf '\t')" read -r EXPECTED_SHA256 NAME SOURCE_URL; do
          printf '%s  %s\n' "$EXPECTED_SHA256" "DATA/DEB/upstream/$NAME" | sha256sum --check
        done < manifests/yogabook-release-debs.tsv
        GENERATED_MANIFEST="$(mktemp)"
        trap 'rm -f "$GENERATED_MANIFEST"' EXIT
        scripts/package-manifest.sh DATA/DEB/packages > "$GENERATED_MANIFEST"
        cmp DATA/DEB/packages.manifest "$GENERATED_MANIFEST"
        GENERATED_PACKAGES_INDEX="$(mktemp)"
        trap 'rm -f "$GENERATED_MANIFEST" "$GENERATED_PACKAGES_INDEX"' EXIT
        (cd DATA/DEB/packages && dpkg-scanpackages . /dev/null) > "$GENERATED_PACKAGES_INDEX"
        cmp DATA/DEB/packages/Packages "$GENERATED_PACKAGES_INDEX"
        while IFS="$(printf '\t')" read -r PACKAGE VERSION ARCH; do
          awk -F "$(printf '\t')" -v package="$PACKAGE" -v version="$VERSION" -v arch="$ARCH" \
            '$1 == package && $2 == version && $3 == arch { found++ } END { exit found == 1 ? 0 : 1 }' \
            "$GENERATED_MANIFEST"
        done < manifests/yogabook-selected-packages.tsv
        echo "Verified six pinned assets, five selected package identities, and the complete dependency manifest"

  embed:
    desc: "Embed the clean, manifest-verified offline package closure into the extracted ISO."
    cmds:
      - task: verify
      - |
        ISO_BASENAME="$(basename "$ISO_FILE")"
        ISO_NAME="${ISO_BASENAME%.iso}"
        EXTRACT_DIR="DATA/ISO/extracted/$ISO_NAME"
        DEST_DIR="$EXTRACT_DIR/pool/yoga-book"
        [ -d "$EXTRACT_DIR" ] || {
          echo "Error: $EXTRACT_DIR does not exist; run task iso:extract." >&2
          exit 1
        }
        mkdir -p "$DEST_DIR"
        find "$DEST_DIR" -mindepth 1 -maxdepth 1 -type f -delete
        cp -v DATA/DEB/packages/*.deb "$DEST_DIR/"
        install -m 0444 DATA/DEB/packages.manifest "$DEST_DIR/packages.manifest"
        install -m 0444 DATA/DEB/packages/Packages "$DEST_DIR/Packages"
        echo "Embedded $(find "$DEST_DIR" -maxdepth 1 -type f -name '*.deb' | wc -l) package(s) and their manifest into $DEST_DIR"
