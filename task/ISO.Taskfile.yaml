version: "3"

tasks:
  default:
    cmds:
      - echo "ISO Taskfile"
  burn:usb:
    desc: "Safely write the existing verified production ISO to an interactively selected USB disk."
    cmds:
      - AUTOINSTALL_TEST_MODE=0 scripts/burn-usb.sh
  build:burn:usb:
    desc: "Clean-build, verify, and safely write the production ISO to an interactively selected USB disk."
    cmds:
      # A child Task process forces production mode through every nested build
      # task, even if test mode is present in the caller's environment.
      - AUTOINSTALL_TEST_MODE=0 task build
      - task: burn:usb
  burn:usb:test:
    desc: "Run the non-destructive USB writer safety tests."
    cmds:
      - scripts/test-burn-usb.sh
  download:
    desc: "Download the official ISO to DATA/ISO/official (Ubuntu 26.04 by default)."
    cmds:
      - |
        mkdir -p DATA/ISO/official
        ISO_BASENAME="$(basename "$ISO_URL")"
        ISO_PATH="DATA/ISO/official/$ISO_BASENAME"
        VERIFICATION_CACHE="$ISO_PATH.sha256-verified"
        EXPECTED_SHA256="${ISO_SHA256:-}"
        if [ -z "$EXPECTED_SHA256" ]; then
          SHA256SUMS_URL="${ISO_URL%/*}/SHA256SUMS"
          EXPECTED_SHA256="$(curl --fail --silent --show-error --location "$SHA256SUMS_URL" \
            | awk -v name="$ISO_BASENAME" '$2 == "*" name || $2 == name { print $1; exit }')"
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "Error: Could not find $ISO_BASENAME in $SHA256SUMS_URL. Set ISO_SHA256 explicitly." >&2
            exit 1
          fi
        fi
        if [ -f "$ISO_PATH" ]; then
          CACHE_KEY="$EXPECTED_SHA256  $(stat --format='%d:%i:%s:%y:%z' "$ISO_PATH")"
          if [ "${ISO_FORCE_VERIFY:-0}" != "1" ] \
            && [ -f "$VERIFICATION_CACHE" ] \
            && [ "$(cat "$VERIFICATION_CACHE")" = "$CACHE_KEY" ]; then
            echo "ISO already downloaded and unchanged since verification at $ISO_PATH"
            exit 0
          fi
          if echo "$EXPECTED_SHA256  $ISO_PATH" | sha256sum --check --status; then
            printf '%s\n' "$CACHE_KEY" > "$VERIFICATION_CACHE.part"
            mv "$VERIFICATION_CACHE.part" "$VERIFICATION_CACHE"
            echo "ISO already downloaded and verified at $ISO_PATH"
            exit 0
          fi
        fi
        PARTIAL_ISO="$ISO_PATH.part"
        wget --continue --progress=dot:giga -O "$PARTIAL_ISO" "$ISO_URL"
        echo "$EXPECTED_SHA256  $PARTIAL_ISO" | sha256sum --check
        mv "$PARTIAL_ISO" "$ISO_PATH"
        CACHE_KEY="$EXPECTED_SHA256  $(stat --format='%d:%i:%s:%y:%z' "$ISO_PATH")"
        printf '%s\n' "$CACHE_KEY" > "$VERIFICATION_CACHE.part"
        mv "$VERIFICATION_CACHE.part" "$VERIFICATION_CACHE"
        echo "Downloaded and verified ISO at $ISO_PATH"
  extract:
    desc: "Extract ISO contents to DATA/ISO/extracted/<iso-file-name> (without .iso) using the $ISO_FILE environment variable."
    cmds:
      - |
        if [ -z "$ISO_FILE" ]; then
          echo "Error: Please set ISO_FILE in your environment or .env file, e.g. ISO_FILE=DATA/ISO/official/ubuntu-26.04-desktop-amd64.iso" >&2
          exit 1
        fi
        ISO_BASENAME="$(basename "$ISO_FILE")"
        ISO_NAME="${ISO_BASENAME%.iso}"
        EXTRACT_DIR="DATA/ISO/extracted/$ISO_NAME"
        if [ -d "$EXTRACT_DIR" ] && [ -n "$(find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
          echo "Error: Extraction directory $EXTRACT_DIR is not empty. Run task iso:rm-extract first." >&2
          exit 1
        fi
        mkdir -p "$EXTRACT_DIR"
        xorriso -osirrox on -indev "$ISO_FILE" -extract / "$EXTRACT_DIR"
        find "$EXTRACT_DIR" -type d -exec chmod u+w {} +
        echo "Extracted to $EXTRACT_DIR"
  rm-extract:
    desc: "Remove extracted ISO directories except .gitkeep"
    cmds:
      - find DATA/ISO/extracted -mindepth 1 -maxdepth 1 ! -name '.gitkeep' -exec rm -rf -- {} +
  patch:
    desc: "Render and validate autoinstall data, then patch it and the offline packages into the ISO tree."
    cmds:
      - task: validate-autoinstall
      - task: cp-nocloud
      - task: cp-grub
      - task: :deb:embed
      - task: checksums
  validate-autoinstall:
    desc: "Render user-data and validate it with cloud-init and the exact 26.04 ISO Subiquity schema."
    cmds:
      - task: render-autoinstall
      - |
        RENDERED_USER_DATA=DATA/autoinstall/nocloud/user-data
        command -v cloud-init >/dev/null 2>&1 || {
          echo "Error: cloud-init is required for autoinstall validation; run task setup." >&2
          exit 1
        }
        cloud-init schema --config-file "$RENDERED_USER_DATA"

        ISO_BASENAME="$(basename "$ISO_FILE")"
        ISO_NAME="${ISO_BASENAME%.iso}"
        EXTRACT_DIR="DATA/ISO/extracted/$ISO_NAME"
        LIVE_LAYER="$EXTRACT_DIR/casper/minimal.standard.live.squashfs"
        [ -f "$LIVE_LAYER" ] || {
          echo "Error: Ubuntu desktop installer layer $LIVE_LAYER is missing." >&2
          exit 1
        }
        grep -Eq '^[[:space:]]*id:[[:space:]]+ubuntu-desktop-minimal[[:space:]]*$' \
          "$EXTRACT_DIR/casper/install-sources.yaml" || {
          echo "Error: the exact ISO does not offer the requested ubuntu-desktop-minimal source." >&2
          exit 1
        }
        VALIDATION_DIR="$(mktemp -d)"
        trap 'rm -rf "$VALIDATION_DIR"' EXIT
        SNAP_PATH="$(unsquashfs -ll "$LIVE_LAYER" 2>/dev/null \
          | awk '$NF ~ /var\/lib\/snapd\/snaps\/ubuntu-desktop-bootstrap_[0-9]+\.snap$/ { sub(/^squashfs-root\//, "", $NF); print $NF; exit }')"
        [ -n "$SNAP_PATH" ] || {
          echo "Error: could not locate the Subiquity-bearing bootstrap snap in $LIVE_LAYER." >&2
          exit 1
        }
        unsquashfs -no-progress -no-xattrs -d "$VALIDATION_DIR/outer" "$LIVE_LAYER" "$SNAP_PATH" >/dev/null
        SNAP_FILE="$VALIDATION_DIR/outer/$SNAP_PATH"
        unsquashfs -no-progress -no-xattrs -d "$VALIDATION_DIR/inner" "$SNAP_FILE" \
          bin/subiquity/autoinstall-schema.json >/dev/null
        scripts/validate-subiquity.py \
          "$VALIDATION_DIR/inner/bin/subiquity/autoinstall-schema.json" \
          "$RENDERED_USER_DATA"
        echo "Validated rendered user-data with cloud-init and the exact Subiquity schema from $ISO_BASENAME"

  render-autoinstall:
    desc: "Render tracked NoCloud data for the production or VM-test disk target."
    cmds:
      - scripts/render-autoinstall.sh DATA/autoinstall/nocloud
  checksums:
    desc: "Regenerate md5sum.txt after changing extracted ISO contents."
    cmds:
      - |
        ISO_BASENAME="$(basename "$ISO_FILE")"
        ISO_NAME="${ISO_BASENAME%.iso}"
        EXTRACT_DIR="DATA/ISO/extracted/$ISO_NAME"
        if [ ! -d "$EXTRACT_DIR" ]; then
          echo "Error: Extracted ISO directory $EXTRACT_DIR does not exist." >&2
          exit 1
        fi
        CHECKSUM_FILE="$(mktemp)"
        trap 'rm -f "$CHECKSUM_FILE"' EXIT
        (
          cd "$EXTRACT_DIR"
          LC_ALL=C find . -type f ! -path './md5sum.txt' ! -path './boot.catalog' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 md5sum
        ) > "$CHECKSUM_FILE"
        install -m 0444 "$CHECKSUM_FILE" "$EXTRACT_DIR/md5sum.txt"
        rm -f "$CHECKSUM_FILE"
        echo "Regenerated $EXTRACT_DIR/md5sum.txt"
  cp-nocloud:
    desc: "Copy freshly rendered NoCloud data into the extracted ISO."
    cmds:
      - |
        if [ -z "$ISO_FILE" ]; then
          echo "Error: Please set ISO_FILE in your environment or .env file, e.g. ISO_FILE=DATA/ISO/official/ubuntu-26.04-desktop-amd64.iso" >&2
          exit 1
        fi
        ISO_BASENAME="$(basename "$ISO_FILE")"
        ISO_NAME="${ISO_BASENAME%.iso}"
        EXTRACT_DIR="DATA/ISO/extracted/$ISO_NAME"
        NO_CLOUD_DIR="DATA/autoinstall/nocloud"
        if [ ! -d "$EXTRACT_DIR" ]; then
          echo "Error: Extracted ISO directory $EXTRACT_DIR does not exist. Run the extract task first." >&2
          exit 1
        fi
        if [ ! -d "$NO_CLOUD_DIR" ]; then
          echo "Error: $NO_CLOUD_DIR directory not found in workspace root." >&2
          exit 1
        fi
        rm -rf "$EXTRACT_DIR/nocloud"
        mkdir -p "$EXTRACT_DIR/nocloud"
        cp -a "$NO_CLOUD_DIR/." "$EXTRACT_DIR/nocloud/"
        echo "Copied $NO_CLOUD_DIR to $EXTRACT_DIR/"

  cp-grub:
    desc: "Copy the patched grub files to the extracted ISO directory using the $ISO_FILE environment variable."
    cmds:
      - |
        if [ -z "$ISO_FILE" ]; then
          echo "Error: Please set ISO_FILE in your environment or .env file, e.g. ISO_FILE=DATA/ISO/official/ubuntu-26.04-desktop-amd64.iso" >&2
          exit 1
        fi
        ISO_BASENAME="$(basename "$ISO_FILE")"
        ISO_NAME="${ISO_BASENAME%.iso}"
        EXTRACT_DIR="DATA/ISO/extracted/$ISO_NAME"
        PATCH_GRUB_DIR="patch/official/boot/grub"
        if [ ! -d "$EXTRACT_DIR" ]; then
          echo "Error: Extracted ISO directory $EXTRACT_DIR does not exist. Run the extract task first." >&2
          exit 1
        fi
        if [ ! -d "$PATCH_GRUB_DIR" ]; then
          echo "Error: $PATCH_GRUB_DIR directory not found in workspace root." >&2
          exit 1
        fi
        cp --remove-destination -v "$PATCH_GRUB_DIR"/* "$EXTRACT_DIR/boot/grub/"
        if [ "${AUTOINSTALL_TEST_MODE:-0}" = 1 ]; then
          sed -i 's/ --- quiet splash/ console=tty0 console=ttyS0 ---/' \
            "$EXTRACT_DIR/boot/grub/grub.cfg" \
            "$EXTRACT_DIR/boot/grub/loopback.cfg"
          echo "Enabled installer serial output in the test-only GRUB menus"
        fi
        echo "Patched grub files copied to $EXTRACT_DIR/boot/grub/"

  remaster:
    desc: "Create, checksum, and verify a remastered hybrid ISO."
    cmds:
      - |
        if [ -z "$ISO_FILE" ]; then
          echo "Error: Please set ISO_FILE in your environment or .env file, e.g. ISO_FILE=DATA/ISO/official/ubuntu-26.04-desktop-amd64.iso" >&2
          exit 1
        fi
        ISO_BASENAME="$(basename "$ISO_FILE")"
        ISO_NAME="${ISO_BASENAME%.iso}"
        EXTRACT_DIR="DATA/ISO/extracted/$ISO_NAME"
        OUTPUT_DIR="DATA/ISO/remastered"
        if [ "${AUTOINSTALL_TEST_MODE:-0}" = 1 ]; then
          OUTPUT_ISO="$OUTPUT_DIR/${ISO_NAME}-test-autoinstall.iso"
        else
          OUTPUT_ISO="$OUTPUT_DIR/${ISO_NAME}-autoinstall.iso"
        fi
        VOLID="Ubuntu-26.04-Yoga-Book"
        if [ ! -d "$EXTRACT_DIR" ]; then
          echo "Error: Extracted ISO directory $EXTRACT_DIR does not exist. Run the extract and patch tasks first." >&2
          exit 1
        fi
        if [ ! -f "$EXTRACT_DIR/boot/grub/i386-pc/eltorito.img" ]; then
          echo "Error: BIOS boot image is missing from $EXTRACT_DIR." >&2
          exit 1
        fi
        mkdir -p "$OUTPUT_DIR"
        PARTIAL_ISO="$OUTPUT_ISO.part"
        rm -f "$PARTIAL_ISO"
        xorriso \
          -indev "$ISO_FILE" \
          -outdev "$PARTIAL_ISO" \
          -volid "$VOLID" \
          -map "$EXTRACT_DIR/nocloud" /nocloud \
          -map "$EXTRACT_DIR/pool/yoga-book" /pool/yoga-book \
          -map "$EXTRACT_DIR/boot/grub/grub.cfg" /boot/grub/grub.cfg \
          -map "$EXTRACT_DIR/boot/grub/loopback.cfg" /boot/grub/loopback.cfg \
          -map "$EXTRACT_DIR/md5sum.txt" /md5sum.txt \
          -boot_image any replay \
          -commit
        mv "$PARTIAL_ISO" "$OUTPUT_ISO"
        (
          cd "$OUTPUT_DIR"
          sha256sum "$(basename "$OUTPUT_ISO")" > "$(basename "$OUTPUT_ISO").sha256.part"
          mv "$(basename "$OUTPUT_ISO").sha256.part" "$(basename "$OUTPUT_ISO").sha256"
        )
        echo "Remastered ISO created at $OUTPUT_ISO"
      - task: verify
  verify:
    desc: "Verify hybrid boot metadata, exact rendered data, minimized desktop selection, packages, and output checksum."
    cmds:
      - |
        ISO_BASENAME="$(basename "$ISO_FILE")"
        ISO_NAME="${ISO_BASENAME%.iso}"
        EXTRACT_DIR="DATA/ISO/extracted/$ISO_NAME"
        if [ "${AUTOINSTALL_TEST_MODE:-0}" = 1 ]; then
          OUTPUT_ISO="DATA/ISO/remastered/${ISO_NAME}-test-autoinstall.iso"
        else
          OUTPUT_ISO="DATA/ISO/remastered/${ISO_NAME}-autoinstall.iso"
        fi
        if [ ! -f "$OUTPUT_ISO" ]; then
          echo "Error: Remastered ISO $OUTPUT_ISO does not exist." >&2
          exit 1
        fi
        REPORT="$(xorriso -indev "$OUTPUT_ISO" -report_el_torito plain -report_system_area plain 2>&1)"
        echo "$REPORT" | grep -q 'El Torito boot img.*BIOS'
        echo "$REPORT" | grep -q 'El Torito boot img.*UEFI'
        echo "$REPORT" | grep -q 'System area summary:.*GPT'
        PVD_REPORT="$(xorriso -indev "$OUTPUT_ISO" -pvd_info 2>&1)"
        echo "$PVD_REPORT" | grep -Fq "Volume id    : 'Ubuntu-26.04-Yoga-Book'"
        VERIFY_DIR="$(mktemp -d)"
        trap 'rm -rf "$VERIFY_DIR"' EXIT
        mkdir -p "$VERIFY_DIR/iso"
        xorriso -osirrox on -indev "$OUTPUT_ISO" \
          -extract /nocloud "$VERIFY_DIR/iso/nocloud" \
          -extract /pool/yoga-book "$VERIFY_DIR/iso/yoga-book" \
          -extract /boot/grub/grub.cfg "$VERIFY_DIR/grub.cfg" \
          -extract /boot/grub/loopback.cfg "$VERIFY_DIR/loopback.cfg" \
          -extract /md5sum.txt "$VERIFY_DIR/md5sum.txt" >/dev/null 2>&1
        diff -ru DATA/autoinstall/nocloud "$VERIFY_DIR/iso/nocloud"
        diff -rq "$EXTRACT_DIR/pool/yoga-book" "$VERIFY_DIR/iso/yoga-book"
        if [ "${AUTOINSTALL_TEST_MODE:-0}" = 1 ]; then
          sed 's/ --- quiet splash/ console=tty0 console=ttyS0 ---/' \
            patch/official/boot/grub/grub.cfg > "$VERIFY_DIR/expected-grub.cfg"
          sed 's/ --- quiet splash/ console=tty0 console=ttyS0 ---/' \
            patch/official/boot/grub/loopback.cfg > "$VERIFY_DIR/expected-loopback.cfg"
          cmp "$VERIFY_DIR/expected-grub.cfg" "$VERIFY_DIR/grub.cfg"
          cmp "$VERIFY_DIR/expected-loopback.cfg" "$VERIFY_DIR/loopback.cfg"
          grep -Fq 'console=tty0 console=ttyS0' "$VERIFY_DIR/grub.cfg"
        else
          cmp patch/official/boot/grub/grub.cfg "$VERIFY_DIR/grub.cfg"
          cmp patch/official/boot/grub/loopback.cfg "$VERIFY_DIR/loopback.cfg"
        fi
        grep -Fxq 'set timeout=1' "$VERIFY_DIR/grub.cfg"
        grep -Fxq 'set timeout=1' "$VERIFY_DIR/loopback.cfg"
        grep -Fxq 'default=0' "$VERIFY_DIR/grub.cfg"
        grep -Fxq 'default=0' "$VERIFY_DIR/loopback.cfg"
        cmp "$EXTRACT_DIR/md5sum.txt" "$VERIFY_DIR/md5sum.txt"
        grep -Eq '^[[:space:]]*id:[[:space:]]+ubuntu-desktop-minimal[[:space:]]*$' \
          "$VERIFY_DIR/iso/nocloud/user-data"
        grep -Fq 'search_drivers: false' "$VERIFY_DIR/iso/nocloud/user-data"
        grep -Fq 'fallback: offline-install' "$VERIFY_DIR/iso/nocloud/user-data"
        grep -Fq 'geoip: false' "$VERIFY_DIR/iso/nocloud/user-data"
        grep -Fq 'shutdown: poweroff' "$VERIFY_DIR/iso/nocloud/user-data"
        grep -Fq 'GRUB_TOP_LEVEL=/boot/vmlinuz-7.2.0-yogabook-20260831-153058' "$VERIFY_DIR/iso/nocloud/user-data"
        grep -Fq '  ./boot/grub/grub.cfg' "$VERIFY_DIR/md5sum.txt"
        grep -Fq '  ./boot/grub/loopback.cfg' "$VERIFY_DIR/md5sum.txt"
        grep -Fq '  ./pool/yoga-book/Packages' "$VERIFY_DIR/md5sum.txt"
        grep -Fq '  ./pool/yoga-book/packages.manifest' "$VERIFY_DIR/md5sum.txt"
        PACKAGE_COUNT="$(find "$VERIFY_DIR/iso/yoga-book" -maxdepth 1 -type f -name '*.deb' | wc -l)"
        EXPECTED_PACKAGE_COUNT="$(find "$EXTRACT_DIR/pool/yoga-book" -maxdepth 1 -type f -name '*.deb' | wc -l)"
        if [ "$PACKAGE_COUNT" -eq 0 ] || [ "$PACKAGE_COUNT" -ne "$EXPECTED_PACKAGE_COUNT" ]; then
          echo "Error: Expected $EXPECTED_PACKAGE_COUNT packages in $OUTPUT_ISO, found $PACKAGE_COUNT." >&2
          exit 1
        fi
        for PACKAGE_PATH in "$EXTRACT_DIR"/pool/yoga-book/*.deb; do
          PACKAGE_NAME="$(basename "$PACKAGE_PATH")"
          grep -Fq "  ./pool/yoga-book/$PACKAGE_NAME" "$VERIFY_DIR/md5sum.txt"
        done
        scripts/package-manifest.sh "$VERIFY_DIR/iso/yoga-book" > "$VERIFY_DIR/generated-packages.manifest"
        cmp "$VERIFY_DIR/iso/yoga-book/packages.manifest" "$VERIFY_DIR/generated-packages.manifest"
        cmp DATA/DEB/packages.manifest "$VERIFY_DIR/iso/yoga-book/packages.manifest"
        (
          cd "$(dirname "$OUTPUT_ISO")"
          sha256sum --check "$(basename "$OUTPUT_ISO").sha256"
        )
        echo "Verified Ubuntu-26.04-Yoga-Book volume label, BIOS/UEFI/GPT boot metadata, minimized-desktop offline autoinstall data, $PACKAGE_COUNT package(s), and the ISO SHA256"

  clean:
    desc: "Remove generated extraction, remaster, rendered configuration, and package work directories."
    cmds:
      - task: rm-extract
      - task: rm-remaster
      - task: :deb:clean
      - rm -rf DATA/autoinstall
  rm-remaster:
    desc: "Remove remastered ISO files except .gitkeep"
    cmds:
      - find DATA/ISO/remastered -mindepth 1 -maxdepth 1 ! -name '.gitkeep' -exec rm -f -- {} +
