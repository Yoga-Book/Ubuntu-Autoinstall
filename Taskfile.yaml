version: "3"

dotenv:
  - .env

env:
  ISO_URL: '{{default "https://releases.ubuntu.com/26.04/ubuntu-26.04-desktop-amd64.iso" .ISO_URL}}'
  ISO_FILE: '{{default "DATA/ISO/official/ubuntu-26.04-desktop-amd64.iso" .ISO_FILE}}'

includes:
  setup:
    taskfile: task/Setup.Taskfile.yaml
  iso:
    taskfile: task/ISO.Taskfile.yaml
  deb:
    taskfile: task/Deb.Taskfile.yaml

tasks:
  build:
    desc: "Clean-build, validate, verify, and checksum the offline Yoga Book autoinstall ISO."
    cmds:
      - task: iso:clean
      - task: iso:download
      - task: deb:download
      - task: deb:resolve
      - task: iso:extract
      - task: iso:patch
      - task: iso:remaster
      - echo "Clean verified build complete; see DATA/ISO/remastered/*.iso and its .sha256 sidecar."

  build-vm-test:
    desc: "Build a clearly named test-only ISO targeting /dev/vda (never use on physical hardware)."
    cmds:
      # Invoke a child Task process so these environment variables propagate
      # through every nested build task (Task-local env does not do that).
      - AUTOINSTALL_TEST_MODE=1 AUTOINSTALL_TARGET_DISK=/dev/vda task build

  vm-test:
    desc: "Run the NIC-less unattended QEMU install/boot acceptance test (build-vm-test first)."
    env:
      AUTOINSTALL_TEST_MODE: "1"
      AUTOINSTALL_TARGET_DISK: "/dev/vda"
    cmds:
      - scripts/vm-test.sh

  vm-test-gui:
    desc: "Run the NIC-less QEMU acceptance test with GTK windows (build-vm-test first)."
    env:
      AUTOINSTALL_TEST_MODE: "1"
      AUTOINSTALL_TARGET_DISK: "/dev/vda"
      VM_TEST_DISPLAY: "gtk"
      VM_TEST_NAME: "yogabook-test-gui"
    cmds:
      - scripts/vm-test.sh

  password-hash:
    aliases:
      - ph
    desc: "Generate a SHA-512 crypt hash for manual user-data customization."
    cmds:
      - mkpasswd -m sha-512

  test-render-autoinstall:
    desc: "Verify tracked default credentials and production/VM disk rendering."
    cmds:
      - scripts/test-render-autoinstall.sh

  test-target-guard:
    desc: "Verify dynamic production eMMC discovery and storage-target patching."
    cmds:
      - scripts/test-verify-target.sh

  password-check:
    aliases:
      - pc
    desc: "Check a password against a hashed password. Usage: task pc HASH='<full_hash>' [PASSWORD='<password>']"
    silent: true
    cmds:
      - |
        bash -c '
        FULL_HASH="$1"
        if [ -z "$FULL_HASH" ]; then
          printf "Usage: task pc HASH=<full_hash> [PASSWORD=<password>]\n"
          exit 2
        fi
        if ! command -v mkpasswd >/dev/null 2>&1; then
          printf "Error: mkpasswd not found. Install the whois package (Debian/Ubuntu) or ensure mkpasswd is available.\n"
          exit 2
        fi
        IFS="$" read -r _ ALG SALT HASHVAL <<< "$FULL_HASH"
        if [ -z "$ALG" ] || [ -z "$SALT" ]; then
          printf "Invalid hash format. Expected \\$algo\\$salt\\$hash.\n"
          exit 2
        fi
        case "$ALG" in
          6) METHOD=sha-512 ;;
          5) METHOD=sha-256 ;;
          1) METHOD=md5 ;;
          *) printf "Unsupported algorithm id: %s\n" "$ALG"; exit 2 ;;
        esac
        if [ -n "$2" ]; then
          PASSWORD="$2"
        fi
        if [ -z "${PASSWORD:-}" ]; then
          read -s -p "Enter password: " PASSWORD; echo
        fi
        GEN_HASH=$(mkpasswd -m "$METHOD" -S "$SALT" "$PASSWORD")
        if [ "$GEN_HASH" = "$FULL_HASH" ]; then
          printf "Password matches.\n"
          exit 0
        else
          printf "Password does not match.\n"
          exit 1
        fi
        ' _ '{{.HASH}}' '{{.PASSWORD}}'
